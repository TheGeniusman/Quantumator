name: Quantumator iPhone/iPad Web-App veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - main.py
      - engine.py
      - make_pwa.py
      - .github/workflows/ios-web-app.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Web-App bauen (Pyodide + sympy werden geladen)
        run: python make_pwa.py --fetch

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
